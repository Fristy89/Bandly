spring:
  application:
    name: bandly-backend

  datasource:
    # Port 5433: the Bandly Docker Postgres, not this machine's separate
    # native Postgres on 5432 (see docker-compose.yml).
    url: ${BANDLY_DB_URL:jdbc:postgresql://localhost:5433/bandly}
    username: bandly
    password: bandly

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  ai:
    anthropic:
      # A syntactically-valid placeholder, not a real key — this is what lets the
      # AnthropicChatModel bean construct cleanly at startup even when nobody has
      # set ANTHROPIC_API_KEY yet. bandly.ai.enabled (below) is the real on/off
      # switch; we never rely on Spring AI's own autoconfiguration being absent
      # (there are open Spring AI issues where that doesn't disable cleanly).
      api-key: ${ANTHROPIC_API_KEY:sk-ant-not-configured}
      chat:
        options:
          model: ${BANDLY_AI_MODEL:claude-sonnet-5}
          max-tokens: 2048
          # No temperature: this model rejects it as a deprecated param
          # (400 invalid_request_error) rather than silently ignoring it.

server:
  port: 8080

bandly:
  jwt:
    # Local-dev-only secret. Overridden via BANDLY_JWT_SECRET in every real environment.
    secret: ${BANDLY_JWT_SECRET:dev-only-secret-key-change-me-please-this-is-not-for-production-use-1234567890}
    access-token-ttl-minutes: 15
    refresh-token-ttl-days: 30
  cors:
    allowed-origins: ${BANDLY_CORS_ORIGINS:http://localhost:3000}
  ai:
    # Explicit feature flag, not "did someone set an API key" sniffing: predictable,
    # and it's what makes the stub adapter path a deliberate choice instead of an
    # accident. Flip to true (and set ANTHROPIC_API_KEY) to call the real model.
    enabled: ${BANDLY_AI_ENABLED:false}
  tts:
    # Same pattern as bandly.ai above: an explicit switch, not key-sniffing.
    # Off by default — the frontend falls back to the browser's own voice
    # (shared/lib/speech.ts) when this is disabled or the call fails.
    # A Gemini API key (generativelanguage.googleapis.com), not a Google
    # Cloud Text-to-Speech key — see GeminiTextToSpeechAdapter for why.
    enabled: ${BANDLY_TTS_ENABLED:false}
    google-api-key: ${BANDLY_TTS_GOOGLE_API_KEY:}
    voice: ${BANDLY_TTS_VOICE:Kore}

logging:
  level:
    com.bandly: DEBUG
