services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bandly
      POSTGRES_USER: bandly
      POSTGRES_PASSWORD: bandly
    ports:
      - "5432:5432"
    volumes:
      - bandly_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bandly"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: bandly
      MINIO_ROOT_PASSWORD: bandly-local-dev
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - bandly_minio_data:/data

  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web UI

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  bandly_postgres_data:
  bandly_minio_data:
